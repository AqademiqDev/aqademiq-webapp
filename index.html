<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/aqademiq-logo.png" />
    <!-- The splash paints the logo the moment React mounts, but the request for
         it could not start until the bundle had parsed — so on anything slower
         than a fast connection the intro played with an empty square where the
         mark should be. Preloading starts the fetch during HTML parse instead. -->
    <link rel="preload" as="image" href="/assets/aqademiq-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aqademiq — Your focus sanctuary.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
